name: Validate and publish package

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "Packages/**"

# IMPORTANT:
# - This workflow intentionally uses pull_request_target so it can merge a valid PR.
# - It NEVER checks out or executes code from the PR.
# - The validator and publisher are loaded from the trusted default branch.
# - Keep this workflow and scripts protected by branch rules / CODEOWNERS.
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: enderpkg-publish-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Validate pull request contents through GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/validate_pr.py

      - name: Merge validated pull request
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/merge_pr.py

      - name: Register package and create community vote
        if: steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/publish.py
