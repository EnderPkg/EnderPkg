name: Validate and publish package
#Hello World
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "Packages/**"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: enderpkg-publish-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch only
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ github.token }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned YAML parser
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"

      - name: Report repository API request status (temporary)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set +x
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPOSITORY}")
          echo "GH_REPOSITORY=${GH_REPOSITORY}"
          echo "HTTP_STATUS=${status}"

      - name: Validate pull request contents through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/validate_pr.py

      - name: Merge validated pull request
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/merge_pr.py

      - name: Register package and create community vote
        if: steps.merge.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/publish.py
