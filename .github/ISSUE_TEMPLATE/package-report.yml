name: Report a package
description: Report a package only when you have a concrete reason to believe it is harmful or violates EnderPKG rules.
title: "[Package report] "
labels: ["package-report"]
body:
  - type: markdown
    attributes:
      value: |
        Reports add a warning to the package's EnderPKG download information.
        Do not report packages merely because you dislike them. Include reproducible evidence.
  - type: input
    id: slug
    attributes:
      label: Package slug
      description: Exact slug from metadata.yaml
      placeholder: example
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason and evidence
      description: Explain the specific concern. Include file paths, suspicious behavior, or reproducible steps.
      placeholder: What exactly is unsafe or inappropriate?
    validations:
      required: true
